# The desktop builds the READMEs link to. Push a tag and every platform's installer lands on one
# GitHub release, as a draft — nothing is published until the tag's builds have all arrived and
# someone has looked at them.
#
#   bun run bump 0.2.0        writes the number where it is declared
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the trigger and `tauri.conf.json` is the number: `tauri-action` reads the version out
# of the config and puts it in the release name, so a tag that disagrees with the config is caught
# by `bun run bump`, which prints the tag to push next to the number it just wrote.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      # One platform failing must not cancel the others: a macOS build that dies still leaves the
      # Windows installer worth having, and the release is a draft either way.
      fail-fast: false
      matrix:
        include:
          # macOS ships two binaries rather than one universal build. A universal `.app` carries
          # both architectures and the model runtime is the largest thing in it, so shipping one
          # download per machine is half the bytes for every reader.
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS (Intel)
          # NSIS `.exe` and an `.msi`, from `bundle.targets: all` in `tauri.conf.json`.
          - platform: windows-latest
            target: ""
            name: Windows
          # `.deb`, `.rpm` and an AppImage. 22.04 rather than latest: the glibc a build links
          # against is the oldest one it will run on, and the newer runner would rule out Debian
          # stable and every LTS beside it.
          - platform: ubuntu-22.04
            target: ""
            name: Linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the macOS runners cross-compile, so the other two are spared the download.
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # `tauri.conf.json`'s `beforeBuildCommand` builds the web app, and it needs the workspace
      # installed before it can. The ONNX and PGlite runtimes are copied into `public/` by the web
      # app's own `prebuild`, so nothing here has to know about them.
      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: echo v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          releaseBody: |
            Download the file for your machine. Everything echo does happens on it — there is no
            account, and the first run downloads the embedding model once and then never needs a
            network again.

            | Machine | File |
            | --- | --- |
            | Windows | `.exe` (installer) or `.msi` |
            | Mac, Apple silicon | `aarch64.dmg` |
            | Mac, Intel | `x64.dmg` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            **These builds are not code-signed yet**, so both desktop systems will say so.

            - macOS: right-click the app and choose Open the first time, or run
              `xattr -cr /Applications/echo.app`.
            - Windows: SmartScreen shows "More info" → "Run anyway".

            Signing them is what a certificate costs, not what the build does — the workflow takes
            the credentials the moment they exist.
