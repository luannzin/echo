[package]
name = "echo-notes"
version = "0.0.0"
edition = "2021"
description = "echo — the note taker that learns with you"
license = "MIT"

[lib]
name = "echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
