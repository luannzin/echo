[package]
name = "echo-notes"
version = "0.0.0"
edition = "2021"
description = "echo — the note taker that learns with you"
license = "MIT"

[lib]
name = "echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fastembed = { version = "6", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
tauri = { version = "2", features = [] }
# Saving a copy of a note to disk: the dialog asks where, the filesystem writes it. Each Tauri
# plugin arrives with the feature that asked for it — these two arrived with "Save a copy".
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
