<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="echo: the note taker that learns with you">
  <title>echo</title>

  <defs>
    <!-- The dither, drawn rather than filtered: GitHub strips SVG filters, so the ramp is
         six bands of one dot pattern at rising opacity instead of an ordered threshold. -->
    <pattern id="echo-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#F2F4FF" />
    </pattern>
  </defs>

  <rect width="1600" height="420" fill="#1A1AFF" />

  <!-- Echoes: one source on the right, rings leaving it and thinning as they go. -->
  <g fill="none" stroke="#F2F4FF">
    <circle cx="1330" cy="205" r="70" stroke-width="3" stroke-opacity="0.55" />
    <circle cx="1330" cy="205" r="150" stroke-width="3" stroke-opacity="0.42" />
    <circle cx="1330" cy="205" r="240" stroke-width="2.5" stroke-opacity="0.31" />
    <circle cx="1330" cy="205" r="340" stroke-width="2.5" stroke-opacity="0.22" />
    <circle cx="1330" cy="205" r="450" stroke-width="2" stroke-opacity="0.15" />
    <circle cx="1330" cy="205" r="570" stroke-width="2" stroke-opacity="0.10" />
    <circle cx="1330" cy="205" r="700" stroke-width="2" stroke-opacity="0.07" />
  </g>
  <circle cx="1330" cy="205" r="15" fill="#F2F4FF" />

  <!-- Wordmark and the one sentence under it. -->
  <text x="110" y="252" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="196" fill="#F2F4FF">echo</text>
  <rect x="112" y="286" width="560" height="1.5" fill="#F2F4FF" fill-opacity="0.34" />
  <text x="112" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" letter-spacing="5.4" fill="#F2F4FF" fill-opacity="0.9">THE NOTE TAKER THAT LEARNS WITH YOU</text>
  <text x="112" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4.2" fill="#F2F4FF" fill-opacity="0.62">NO AI · OPEN SOURCE · RUNS ON YOUR MACHINE · NO ACCOUNT</text>

  <!-- The ramp, densest at the edge the page continues into. -->
  <g fill="url(#echo-dots)">
    <rect x="0" y="380" width="1600" height="8" opacity="0.06" />
    <rect x="0" y="388" width="1600" height="8" opacity="0.11" />
    <rect x="0" y="396" width="1600" height="8" opacity="0.18" />
    <rect x="0" y="404" width="1600" height="8" opacity="0.27" />
    <rect x="0" y="412" width="1600" height="8" opacity="0.38" />
  </g>
</svg>
